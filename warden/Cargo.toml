[package]
name = "warden"
version = "0.2.3"
edition = "2021"
description = "Terrarium Warden — per-session MITM egress gateway (credential injection + content scan + allow-list/audit)"

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "fs", "signal", "sync"] }
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
time = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "clock"]

[dependencies.webpki-roots]
version = "1.0"

[dependencies.hmac]
version = "0.13"

[dependencies.sha2]
version = "0.11"
