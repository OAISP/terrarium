# nginx in front of the Terrarium console.
#
# Only the CONSOLE is proxied. The orchestrator (:8900) is deliberately absent: it is the
# admin API, the console reaches it over the deploy network, and it has no business being
# routable from the internet. If you expose it anyway, a leaked TERRA_TOKEN is total control
# of every agent and transcript.
#
# Three settings here are not stylistic. Each of them breaks a specific feature if dropped:
# the SSE transcript, file uploads, and login. They are marked below.
#
#   ln -s .../terrarium.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name terrarium.example.com;

    # ACME challenges must stay on :80; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name terrarium.example.com;

    ssl_certificate     /etc/letsencrypt/live/terrarium.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terrarium.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # REQUIRED — not hardening. The console sets its auth cookie with `Secure` (the image runs
    # NODE_ENV=production), and a browser silently discards a Secure cookie delivered over
    # plain http:// on anything but localhost. Serve this over HTTP and login appears to
    # succeed and leaves you logged out, with nothing in any log to say why.
    #
    # HSTS is separate and optional; enable it once you are sure the certificate renews.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The console is the admin UI for a tool that runs arbitrary code. It should not be
    # embeddable, and it should not leak its URLs to third parties.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # REQUIRED for file upload into a session workspace. The orchestrator accepts 25 MiB and
    # rejects larger on Content-Length; nginx's default is 1 MiB, so without this the console's
    # upload fails at nginx with a 413 the app never sees and cannot explain. The small margin
    # covers multipart framing overhead.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3737;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # REQUIRED. TLS terminates here and the hop to the console is plain HTTP, so without
        # these the console believes it is serving http:// while the browser's Origin header
        # says https://. Its CSRF guard compares the two and rejects every mutation —
        # including login — as `cross_site_request`, which reads like an attack rather than a
        # misconfiguration. They are also what stops absolute URLs being built as http://
        # and blocked as mixed content.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # REQUIRED for the live transcript. The session stream is Server-Sent Events, and
        # nginx buffers proxied responses by default — it would hold each event until a buffer
        # filled, so the transcript arrives in silent bursts or not at all.
        #
        # Terrarium already sends `X-Accel-Buffering: no`, which nginx honours per response, so
        # in practice the stream works without this. It is set explicitly anyway: relying on a
        # header the app happens to send makes a working transcript depend on something no one
        # would think to preserve while editing the app.
        proxy_buffering off;
        proxy_cache off;

        # An idle session sends a keepalive comment every 15s (TERRA_SSE_HEARTBEAT_S), so
        # anything above ~60s is safe. This is generous on purpose: a long agent turn can be
        # quiet for minutes, and a proxy timeout mid-turn surfaces as a reconnect loop rather
        # than as an error. Raise TERRA_SSE_HEARTBEAT_S rather than lowering this.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── if you are NOT terminating TLS here ──────────────────────────────────────
#
# Behind Cloudflare, a load balancer, or another proxy that already does TLS: keep every
# setting above except the ssl_* lines, and make sure whatever sits in front forwards
# X-Forwarded-Proto: https. The Secure-cookie constraint is about what the BROWSER connects
# to, so a TLS front end with a plaintext hop to nginx is fine.
#
# ── if you only ever reach the console yourself ───────────────────────────────
#
# Skip nginx. Bind the console to loopback in shunt.toml:
#
#     publish = ["127.0.0.1:3737:3737"]
#
# and tunnel: ssh -L 3737:127.0.0.1:3737 you@your-vps
#
# Then browse http://localhost:3737 — localhost is exempt from the Secure-cookie rule, so
# login works, and the admin UI is never exposed at all. For a single operator this is
# strictly safer than any config in this file.
